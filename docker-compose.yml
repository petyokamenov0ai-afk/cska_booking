services:
  postgres:
    image: postgres:16
    container_name: cska-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cska_booking
      POSTGRES_USER: cska
      POSTGRES_PASSWORD: cska
      # Sensible defaults for a dev box; Cyrillic data is stored as UTF-8.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - cska_booking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cska -d cska_booking']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  cska_booking_pgdata:
